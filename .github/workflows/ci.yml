name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:docs
      - run: npm run typecheck
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: proofpay_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: proofpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proofpay_test -d proofpay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://proofpay_test:local_ci_only@localhost:5432/proofpay_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o bin/proofpay-api ./cmd/server
